name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: pachyderm-linux-amd64
          - goos: darwin
            goarch: amd64
            asset: pachyderm-darwin-amd64
          - goos: windows
            goarch: amd64
            asset: pachyderm-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o dist/${{ matrix.asset }} .

      # GitHub release assets are plain files, not archives, so the exec bit
      # set here is lost on download. Only tar preserves it through that
      # round trip, so ship non-Windows binaries inside a .tar.gz.
      - name: Package (non-Windows)
        if: matrix.goos != 'windows'
        run: |
          chmod +x dist/${{ matrix.asset }}
          tar -C dist -czf dist/${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
          rm dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}
          path: dist/*

  build-gui:
    name: Build GUI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux GUI build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build GUI (linux)
        if: matrix.platform == 'linux'
        working-directory: gui
        # Ubuntu no longer ships libwebkit2gtk-4.0-dev; only 4.1 is available,
        # so Wails needs the webkit2_41 build tag to pkg-config against it.
        run: wails build -tags webkit2_41

      - name: Build GUI (windows/macos)
        if: matrix.platform != 'linux'
        working-directory: gui
        run: wails build

      - name: Package artifact (linux)
        if: matrix.platform == 'linux'
        # Same as the CLI: a raw release-asset binary loses its exec bit on
        # download, so ship it inside a .tar.gz to preserve the permission.
        run: |
          mkdir -p dist
          chmod +x gui/build/bin/pachyderm-app
          tar -C gui/build/bin -czf dist/pachyderm-app-linux-amd64.tar.gz pachyderm-app

      - name: Package artifact (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp gui/build/bin/pachyderm-app.exe dist/pachyderm-app-windows-amd64.exe

      - name: Package artifact (macos)
        if: matrix.platform == 'darwin'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent gui/build/bin/pachyderm-app.app dist/pachyderm-app-macos-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}
          path: dist/*

  release:
    name: Create Release
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
