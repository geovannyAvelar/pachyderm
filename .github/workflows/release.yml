name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: pachyderm-linux-amd64
          - goos: darwin
            goarch: amd64
            asset: pachyderm-darwin-amd64
          - goos: windows
            goarch: amd64
            asset: pachyderm-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-X pachyderm/cmd.version=${VERSION}" -o dist/${{ matrix.asset }} .

      - name: Build .deb package
        if: matrix.goos == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          export VERSION="${GITHUB_REF_NAME#v}"
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm-cli.yaml -p deb -t dist/

      # GitHub release assets are plain files, not archives, so the exec bit
      # set here is lost on download. Only tar preserves it through that
      # round trip, so ship non-Windows binaries inside a .tar.gz.
      - name: Package (non-Windows)
        if: matrix.goos != 'windows'
        run: |
          chmod +x dist/${{ matrix.asset }}
          tar -C dist -czf dist/${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
          rm dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}
          path: dist/*

  build-gui:
    name: Build GUI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux GUI build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build GUI (linux)
        if: matrix.platform == 'linux'
        working-directory: gui
        shell: bash
        # Ubuntu no longer ships libwebkit2gtk-4.0-dev; only 4.1 is available,
        # so Wails needs the webkit2_41 build tag to pkg-config against it.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          wails build -tags webkit2_41 -ldflags "-X main.appVersion=${VERSION}"

      - name: Build GUI (windows/macos)
        if: matrix.platform != 'linux'
        working-directory: gui
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          wails build -ldflags "-X main.appVersion=${VERSION}"

      - name: Package artifact (linux)
        if: matrix.platform == 'linux'
        # Same as the CLI: a raw release-asset binary loses its exec bit on
        # download, so ship it inside a .tar.gz to preserve the permission.
        run: |
          mkdir -p dist
          chmod +x gui/build/bin/pachyderm-app
          tar -C gui/build/bin -czf dist/pachyderm-app-linux-amd64.tar.gz pachyderm-app

      - name: Build .deb package
        if: matrix.platform == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          export VERSION="${GITHUB_REF_NAME#v}"
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm-gui.yaml -p deb -t dist/

      - name: Package artifact (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp gui/build/bin/pachyderm-app.exe dist/pachyderm-app-windows-amd64.exe

      - name: Package artifact (macos)
        if: matrix.platform == 'darwin'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent gui/build/bin/pachyderm-app.app dist/pachyderm-app-macos-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}
          path: dist/*

  release:
    name: Create Release
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rebuilds the whole apt repo from scratch every release, from every .deb
  # ever published to this repo's Releases, and republishes it to GitHub
  # Pages. Stateless by design: no snapshot/db is carried over between runs,
  # so the repo can't drift from what's actually on the Releases page.
  #
  # One-time setup this job depends on (not done by the workflow itself):
  #   - Settings > Pages > Build and deployment > Source = "GitHub Actions".
  #   - A GPG signing key, with its private key and passphrase saved as the
  #     APT_GPG_PRIVATE_KEY and APT_GPG_PASSPHRASE repo secrets. Generate one
  #     with e.g. `gpg --full-generate-key`, then:
  #       gpg --armor --export-secret-keys <key-id> # -> APT_GPG_PRIVATE_KEY
  #     Keep the only copy of the private key somewhere safe outside CI too.
  apt-repo:
    name: Publish APT repository
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install aptly
        run: |
          version=1.6.3
          curl -fsSL "https://github.com/aptly-dev/aptly/releases/download/v${version}/aptly_${version}_linux_amd64.zip" -o aptly.zip
          unzip -q aptly.zip -d aptly-extracted
          sudo install -m 0755 "aptly-extracted/aptly_${version}_linux_amd64/aptly" /usr/local/bin/aptly
          aptly version

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"
          gpg --batch --yes --export "$key_id" > pubkey.gpg

      - name: Download every .deb ever released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName'); do
            # Older releases (before .deb packaging was added) have no matching
            # assets, which makes gh exit non-zero; skip those, not the release.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs --skip-existing || true
          done
          ls -la debs

      - name: Build the repo
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          aptly repo create -distribution=stable -component=main pachyderm
          aptly repo add pachyderm debs
          aptly snapshot create pachyderm-snapshot from repo pachyderm

          echo "$GPG_PASSPHRASE" > /tmp/passphrase
          aptly publish snapshot -batch -passphrase-file=/tmp/passphrase -gpg-key="$GPG_KEY_ID" pachyderm-snapshot
          rm -f /tmp/passphrase

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp -r ~/.aptly/public/. site/
          cp pubkey.gpg site/pubkey.gpg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
