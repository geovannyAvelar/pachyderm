name: CI

on:
  push:
    # Tags are covered by release.yml, which runs this workflow itself.
    branches: ["**"]
  pull_request:
  # Lets release.yml run the same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (CLI)
        run: go vet ./...

  test-cli:
    name: Test CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm and macos-latest are arm64, macos-15-intel is
        # Intel, so every platform pachyderm ships a CLI for gets tested.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race ./...
          else
            go test ./...
          fi

      # Installs a real PostgreSQL release end to end: resolves the
      # version against GitHub, downloads the binary for this runner's
      # platform, checks its checksum, and runs it.
      - name: Smoke test
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go build -o pachyderm-smoke .
          ./pachyderm-smoke get 17
          ./pachyderm-smoke list --installed
          postgres="$HOME/.pachyderm/current/bin/postgres"
          [ "$RUNNER_OS" = "Windows" ] && postgres="$postgres.exe"
          "$postgres" --version

  test-gui:
    name: Test GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist, which only exists after a frontend
      # build. The Go code doesn't need the real frontend, so a placeholder
      # is enough to compile and test it.
      - name: Placeholder frontend build
        shell: bash
        run: mkdir -p gui/frontend/dist && echo '<!doctype html>' > gui/frontend/dist/index.html

      - name: go vet
        working-directory: gui
        shell: bash
        run: |
          tags=""
          [ "$RUNNER_OS" = "Linux" ] && tags="-tags webkit2_41"
          go vet $tags ./...

      - name: Test
        working-directory: gui
        shell: bash
        run: |
          tags=""
          [ "$RUNNER_OS" = "Linux" ] && tags="-tags webkit2_41"
          go test $tags ./...

  # Runs the CLI end to end in clean Debian, Ubuntu, and Fedora containers
  # (see integration/), with real PostgreSQL and PostGIS downloads.
  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      # The integration module needs a newer Go than the CLI (for
      # testcontainers); its go.mod names it, and building the CLI from it
      # works the same.
      - uses: actions/setup-go@v5
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum

      - name: go vet
        working-directory: integration
        run: go vet ./...

      - name: Test
        working-directory: integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go test -v -timeout 40m ./...
