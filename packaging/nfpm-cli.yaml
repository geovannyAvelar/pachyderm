name: pachyderm
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: database
priority: optional
maintainer: "Giovanni Avelar <geovanny.avelar@gmail.com>"
homepage: "https://github.com/geovannyAvelar/pachyderm"
license: MIT
description: |
  A version manager for PostgreSQL: install, switch between, and run
  multiple PostgreSQL versions locally, the way asdf or nvm manage other
  runtimes.

contents:
  # nfpm doesn't expand variables in src, so release.yml copies the
  # binary for the architecture being packaged to this fixed path.
  - src: ./dist/deb/pachyderm
    dst: /usr/bin/pachyderm
    file_info:
      mode: 0755
