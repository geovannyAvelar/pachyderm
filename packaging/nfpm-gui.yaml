name: pachyderm-app
arch: amd64
platform: linux
version: ${VERSION}
section: database
priority: optional
maintainer: "Giovanni Avelar <geovanny.avelar@gmail.com>"
homepage: "https://github.com/geovannyAvelar/pachyderm"
license: MIT
description: |
  Desktop companion app for Pachyderm: install and switch PostgreSQL
  versions, start/stop a local server, and open psql from a menu-bar app,
  similar to Postgres.app.

depends:
  - libgtk-3-0
  - "libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37"

contents:
  - src: ./gui/build/bin/pachyderm-app
    dst: /usr/bin/pachyderm-app
    file_info:
      mode: 0755
  - src: ./packaging/pachyderm-app.desktop
    dst: /usr/share/applications/pachyderm-app.desktop
    file_info:
      mode: 0644
  - src: ./gui/build/appicon.png
    dst: /usr/share/pixmaps/pachyderm-app.png
    file_info:
      mode: 0644
